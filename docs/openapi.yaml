openapi: 3.1.0
info:
  title: POS System API
  version: 0.1.0
  description: POS health checks and session authentication contract.
servers:
  - url: http://localhost:8080
paths:
  /v1/auth/login:
    post:
      operationId: login
      summary: Create a bearer session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 1, maxLength: 72 }
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_at]
                properties:
                  access_token: { type: string }
                  token_type: { type: string, const: Bearer }
                  expires_at: { type: string, format: date-time }
        '400': { description: Invalid request }
        '401': { description: Invalid credentials }
  /v1/me:
    get:
      operationId: currentUser
      summary: Return the authenticated user and permissions
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Current user }
        '401': { description: Missing, invalid, or expired bearer token }
  /v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current bearer session
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Session revoked }
        '401': { description: Missing or invalid bearer token }
  /v1/orders/{orderID}/payments:
    post:
      operationId: chargeOrder
      summary: Charge an order using the configured payment provider
      security: [{ bearerAuth: [] }]
      parameters:
        - name: orderID
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200': { description: Payment attempt result }
        '400': { description: Invalid order identifier or payment response }
        '401': { description: Missing or invalid bearer token }
        '403': { description: User lacks payment.create permission }
        '409': { description: Order is not payable }
        '502': { description: Payment provider unavailable }
  /v1/orders:
    get:
      operationId: listOrders
      summary: List recent orders with optional status and order-number search
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [PENDING, CONFIRMED, PAID, CANCELLED, REFUNDED] } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Orders sorted newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OrderListItem' }
        '400': { description: Invalid filters }
        '401': { description: Missing or invalid bearer token }
        '403': { description: User lacks order.read permission }
  /v1/orders/{orderID}:
    get:
      operationId: getOrder
      summary: Get an order and its historical item snapshots
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: orderID, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200':
          description: Order detail with checkout-time names, SKUs, and prices
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetail' }
        '400': { description: Invalid order identifier }
        '401': { description: Missing or invalid bearer token }
        '403': { description: User lacks order.read permission }
        '404': { description: Order not found }
  /v1/orders/checkout:
    post:
      operationId: checkout
      summary: Create an order and atomically decrement stock
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items]
              properties:
                customer_id: { type: integer, format: int64, minimum: 1 }
                items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    additionalProperties: false
                    required: [product_id, quantity]
                    properties:
                      product_id: { type: integer, format: int64, minimum: 1 }
                      quantity: { type: integer, format: int64, minimum: 1 }
      responses:
        '201': { description: Pending order created with server-derived prices }
        '400': { description: Invalid checkout request }
        '401': { description: Missing or invalid bearer token }
        '403': { description: User lacks order.create permission }
        '404': { description: Product is unavailable }
        '409': { description: Insufficient stock }
  /v1/orders/{orderID}/cancel:
    post:
      operationId: cancelOrder
      summary: Cancel a pending or confirmed order and restore its stock
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: orderID, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '204': { description: Order cancelled; stock movement and audit event recorded }
        '400': { description: Invalid order identifier }
        '401': { description: Missing or invalid bearer token }
        '403': { description: User lacks order.cancel permission }
        '404': { description: Order not found }
        '409': { description: Order state prevents cancellation or payment is still in progress }
  /v1/orders/{orderID}/refunds:
    post:
      operationId: refundOrder
      summary: Refund the full amount of a paid order
      description: Reserves one refund per order, calls the provider with a stable idempotency key, and updates payment and order state transactionally. Physical stock is not changed automatically; use an inventory return adjustment after goods are received.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: orderID, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string, maxLength: 250 }
      responses:
        '201': { description: Refund completed or replayed }
        '400': { description: Invalid refund request or missing idempotency key }
        '401': { description: Missing or invalid bearer token }
        '403': { description: User lacks payment.refund permission }
        '404': { description: Order not found }
        '409': { description: Order is not paid, another refund is in progress, or idempotency key conflicts }
        '502': { description: Provider unavailable; retry with the same key }
  /v1/categories:
    get:
      operationId: listCategories
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Active categories }
        '401': { description: Missing or invalid bearer token }
        '403': { description: User lacks product.read permission }
    post:
      operationId: createCategory
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                description: { type: string, maxLength: 1000 }
      responses:
        '201': { description: Category created }
        '400': { description: Invalid category }
        '401': { description: Missing or invalid bearer token }
        '403': { description: User lacks product.create permission }
        '409': { description: Category name already exists }
  /v1/products:
    get:
      operationId: listProducts
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: category_id, in: query, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200': { description: Active products }
        '400': { description: Invalid list filters }
        '401': { description: Missing or invalid bearer token }
        '403': { description: User lacks product.read permission }
    post:
      operationId: createProduct
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sku, name, price_minor]
              properties:
                category_id: { type: integer, format: int64, minimum: 1 }
                sku: { type: string, minLength: 1, maxLength: 64 }
                name: { type: string, minLength: 1, maxLength: 200 }
                description: { type: string, maxLength: 2000 }
                price_minor: { type: integer, format: int64, minimum: 0 }
                currency: { type: string, pattern: '^[A-Z]{3}$', default: IDR }
      responses:
        '201': { description: Product created }
        '400': { description: Invalid product or category }
        '401': { description: Missing or invalid bearer token }
        '403': { description: User lacks product.create permission }
        '409': { description: SKU already exists }
  /v1/customers:
    get:
      operationId: listCustomers
      summary: Search and list customers
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 120 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200': { description: Customers matching the filters }
        '400': { description: Invalid search or pagination values }
        '401': { description: Missing or invalid bearer token }
        '403': { description: User lacks customer.read permission }
    post:
      operationId: createCustomer
      summary: Create a customer record
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              anyOf:
                - required: [email]
                - required: [phone]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                email: { type: string, format: email, maxLength: 254 }
                phone: { type: string, maxLength: 32 }
      responses:
        '201': { description: Customer created }
        '400': { description: Invalid customer details }
        '401': { description: Missing or invalid bearer token }
        '403': { description: User lacks customer.create permission }
        '409': { description: Email is already registered }
  /v1/reports/sales:
    get:
      operationId: getSalesReport
      summary: Summarize paid and refunded orders by currency
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Gross sales, successful refunds, and net sales for the inclusive date range
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesReport' }
        '400': { description: Invalid date or range greater than 366 days }
        '401': { description: Missing or invalid bearer token }
        '403': { description: User lacks report.read permission }
  /v1/inventory/{productID}:
    get:
      operationId: getInventory
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: productID, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200': { description: Current stock quantity }
        '401': { description: Missing or invalid bearer token }
        '403': { description: User lacks inventory.read permission }
        '404': { description: Product inventory not found }
  /v1/inventory/{productID}/adjustments:
    post:
      operationId: adjustInventory
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: productID, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [type, quantity_delta, reason]
              properties:
                type: { type: string, enum: [RECEIPT, ADJUSTMENT, RETURN] }
                quantity_delta: { type: integer, format: int64, not: { const: 0 } }
                reason: { type: string, minLength: 1 }
      responses:
        '200': { description: Inventory balance after adjustment }
        '400': { description: Invalid adjustment }
        '401': { description: Missing or invalid bearer token }
        '403': { description: User lacks inventory.adjust permission }
        '404': { description: Product unavailable }
        '409': { description: Insufficient stock }
  /readyz:
    get:
      operationId: readinessCheck
      summary: Check whether the service can access its database
      responses:
        '200':
          description: Database is reachable
          content:
            text/plain:
              schema:
                type: string
              example: ready
        '503':
          description: Database is unavailable
  /healthz:
    get:
      operationId: healthCheck
      summary: Check process health
      responses:
        '200':
          description: The HTTP process is running
          content:
            text/plain:
              schema:
                type: string
              example: ok
components:
  schemas:
    OrderDetail:
      allOf:
        - { $ref: '#/components/schemas/OrderListItem' }
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                type: object
                required: [product_id, product_name, sku, quantity, unit_price_minor, line_total_minor, currency]
                properties:
                  product_id: { type: integer, format: int64 }
                  product_name: { type: string }
                  sku: { type: string }
                  quantity: { type: integer, format: int64 }
                  unit_price_minor: { type: integer, format: int64 }
                  line_total_minor: { type: integer, format: int64 }
                  currency: { type: string, pattern: '^[A-Z]{3}$' }
    OrderListItem:
      type: object
      required: [id, order_number, cashier_id, cashier_name, status, total_minor, currency, created_at]
      properties:
        id: { type: integer, format: int64 }
        order_number: { type: string }
        customer_id: { type: integer, format: int64 }
        customer_name: { type: string }
        cashier_id: { type: integer, format: int64 }
        cashier_name: { type: string }
        status: { type: string, enum: [PENDING, CONFIRMED, PAID, CANCELLED, REFUNDED] }
        total_minor: { type: integer, format: int64 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        created_at: { type: string, format: date-time }
    SalesReport:
      type: object
      required: [from, to, currencies]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        currencies:
          type: array
          items:
            type: object
            required: [currency, paid_order_count, gross_minor, refunded_minor, net_minor]
            properties:
              currency: { type: string, pattern: '^[A-Z]{3}$' }
              paid_order_count: { type: integer, format: int64, minimum: 0 }
              gross_minor: { type: integer, format: int64, minimum: 0 }
              refunded_minor: { type: integer, format: int64, minimum: 0 }
              net_minor: { type: integer, format: int64 }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
